name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit permissions for CLA Assistant Lite (signatures stored in this repo on a
# dedicated branch; no external service holds the data).
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "cla-signatures"
          # a2a-implement is the repository owner's local bridge automation
          # identity (implement@a2a-bridge.local) — commits it authors are the
          # owner's own contributions, so it is exempt from the CLA like
          # dependabot.
          allowlist: "shoedog,dependabot[bot],a2a-implement"
