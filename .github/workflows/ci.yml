name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Supersede in-flight runs for the same ref. Never cancel on main: a main run is the
# post-merge record for that commit, and re-running it replaces the log we would need
# to read on a failure. PR refs are free to be superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # One-shot CI build/test jobs never reuse incremental artifacts across a run (R2f1b S1); a measured
  # verifier target showed 44% of a 15.77 GiB cache was incremental artifacts with no reuse payoff.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  issues: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate issue intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_labels="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/labels?per_page=100" --jq '.[].name' > "$live_labels"
          ruby tools/validate_issue_intake.rb --live-labels "$live_labels"
          ruby tools/validate_issue_intake_test.rb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Bridge-store parent authority as root
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTFLAGS=$RUSTFLAGS" \
            "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            cargo test -p bridge-store sqlite::r2f0a_history_tests::real_readonly_parent_lock_and_database_failures_remain_distinct \
            --locked -- --exact --nocapture --test-threads=1

      - name: cargo deny check
        run: cargo deny check

      - name: Workflow artifact hygiene
        run: cargo run -p a2a-bridge -- validate --repo-hygiene

  coverage:
    name: Build, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest@0.9.146

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Keep coverage-instrumented artifacts apart from the uninstrumented control.
          shared-key: coverage-instrumented

      - name: Run instrumented workspace tests once
        env:
          # LLVM coverage already supplies its own coverage mapping. Full dev debuginfo can
          # inflate the bridge executable beyond fallback-plan's intentional 256 MiB input cap.
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo llvm-cov nextest --workspace --locked --no-report

      - name: Check coverage reports
        run: |
          cargo llvm-cov report --locked --json --summary-only --fail-under-lines 85 > coverage-workspace.json
          python3 tools/coverage_summary.py coverage-workspace.json

  test-uninstrumented:
    name: Test (uninstrumented control)
    runs-on: ubuntu-latest

    # Coverage instrumentation has its own failure modes (see
    # docs/superpowers/reviews/2026-08-17-coverage-lane-flake-family-investigation.md), so this
    # complete uninstrumented control separates instrumentation failures from regressions.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-uninstrumented

      # --no-fail-fast reports the complete failure population in one pass. nextest does not
      # run doctests, so the second command retains the workspace's doctest coverage.
      - name: Test workspace (no coverage instrumentation)
        run: |
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --doc --locked

  bridge-store-macos:
    name: Bridge Store (macOS 14)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bridge-store

      - name: Test bridge-store
        run: cargo test -p bridge-store --locked -- --test-threads=1

  bridge-store-unsupported-windows:
    name: Bridge Store Unsupported Target (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bridge-store

      - name: Test unsupported history target contract
        run: >-
          cargo test -p bridge-store sqlite::r2f0a_history_tests::unsupported_target_refuses_all_history_writers_before_mutation
          --locked -- --exact --nocapture
