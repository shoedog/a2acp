name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

# Supersede in-flight runs for the same ref. Never cancel on main: a main run is the
# post-merge record for that commit, and re-running it replaces the log we would need
# to read on a failure. PR refs are free to be superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # One-shot CI build/test jobs never reuse incremental artifacts across a run (R2f1b S1); a measured
  # verifier target showed 44% of a 15.77 GiB cache was incremental artifacts with no reuse payoff.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  issues: read

jobs:
  ci:
    name: Build, Lint, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Print rustc version
        run: rustc --version

      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate issue intake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_labels="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/labels?per_page=100" --jq '.[].name' > "$live_labels"
          ruby tools/validate_issue_intake.rb --live-labels "$live_labels"
          ruby tools/validate_issue_intake_test.rb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Bridge-store parent authority as root
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTFLAGS=$RUSTFLAGS" \
            "CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            cargo test -p bridge-store sqlite::r2f0a_history_tests::real_readonly_parent_lock_and_database_failures_remain_distinct \
            --locked -- --exact --nocapture --test-threads=1

      - name: cargo deny check
        run: cargo deny check

      - name: Workflow artifact hygiene
        run: cargo run -p a2a-bridge -- validate --repo-hygiene

      - name: Coverage — workspace (≥85% line coverage)
        # LLVM coverage already supplies its own coverage mapping. Full dev debuginfo can
        # inflate the bridge executable beyond fallback-plan's intentional 256 MiB input cap.
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo llvm-cov --workspace --fail-under-lines 85

      # R2f1b currently measures 86.50%. Keep a hard floor while the deferred
      # coverage follow-on restores the package to 90%.
      - name: Coverage — bridge-core (≥86% line coverage)
        run: cargo llvm-cov --package bridge-core --fail-under-lines 86

      - name: Coverage — bridge-acp (≥90% line coverage)
        run: cargo llvm-cov --package bridge-acp --fail-under-lines 90

      - name: Coverage — bridge-api (≥90% line coverage)
        run: cargo llvm-cov --package bridge-api --fail-under-lines 90

      # R2f1b currently measures 87.63%. Keep a hard floor while the deferred
      # coverage follow-on restores the package to 90%.
      - name: Coverage — bridge-workflow (≥87% line coverage)
        run: cargo llvm-cov --package bridge-workflow --fail-under-lines 87

      - name: Coverage — bridge-coordinator (≥85% line coverage)
        run: cargo llvm-cov --package bridge-coordinator --fail-under-lines 85

      - name: Coverage — bridge-mcp (≥70% line coverage)
        run: cargo llvm-cov --package bridge-mcp --fail-under-lines 70

  test-uninstrumented:
    name: Test (uninstrumented control)
    runs-on: ubuntu-latest

    # The workspace's only other full-suite execution is `cargo llvm-cov --workspace` in the
    # `ci` job. Coverage instrumentation has its own failure modes (see
    # docs/superpowers/reviews/2026-08-17-coverage-lane-flake-family-investigation.md), so a
    # red there is ambiguous between a real regression and an instrumentation artifact. This
    # job is the control that disambiguates them: same suite, no instrumentation. If this is
    # green and the coverage lane is red, the defect is in the instrumented lane.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Print rustc version
        run: rustc --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Distinct from the `ci` job's key: that target dir holds llvm-cov-instrumented
          # artifacts, and sharing it would defeat the point of this job.
          key: ${{ runner.os }}-cargo-uninstrumented-${{ hashFiles('**/Cargo.lock') }}

      # --no-fail-fast so a red run reports the complete failure population in one pass.
      # Enumerating the whole population before the next retry is a standing lane rule.
      - name: Test workspace (no coverage instrumentation)
        run: cargo test --workspace --locked --no-fail-fast

  bridge-store-macos:
    name: Bridge Store (macOS 14)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bridge-store-${{ hashFiles('**/Cargo.lock') }}

      - name: Test bridge-store
        run: cargo test -p bridge-store --locked -- --test-threads=1

  bridge-store-unsupported-windows:
    name: Bridge Store Unsupported Target (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bridge-store-${{ hashFiles('**/Cargo.lock') }}

      - name: Test unsupported history target contract
        run: >-
          cargo test -p bridge-store sqlite::r2f0a_history_tests::unsupported_target_refuses_all_history_writers_before_mutation
          --locked -- --exact --nocapture
