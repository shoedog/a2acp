# Current pinned Luna reader support profile. The immutable image is deliberate.
default = "codex-luna-reader"
allowed_cwd_root = "/Users/wesleyjinks/code"

[[agents]]
id = "codex-luna-reader"
cmd = "codex-acp"
pre_authenticated = true
model = "gpt-5.6-luna"
effort = "low"
args = ["-c", "sandbox_mode=\"danger-full-access\"", "-c", "approval_policy=\"never\""]

[agents.sandbox]
image = "sha256:79a7ded7f20c9cac640a331436ba0d01b198a82b98b980cf220c37f93e94960f"
mount = "/Users/wesleyjinks/code"
access = "ro"
egress = "locked"
network = "a2a-egress-internal"
proxy = "http://a2a-egress-proxy:8888"
volumes = ["/Users/wesleyjinks/.config/a2a-creds/codex/auth.json:/root/.codex/auth.json"]

[registry]
allowed_cmds = ["docker"]

[server]
addr = "127.0.0.1:8080"
