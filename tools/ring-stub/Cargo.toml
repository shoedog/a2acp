# PROBE-ONLY signature stub for `ring`. NOT a workspace member and never linked into a real
# build — it exists solely so `tools/check-nonunix.sh` can cross-compile `bridge-core` for a
# non-unix target. `ring`'s C build script cannot cross-compile from macOS, which is what made
# the non-unix lane locally ungated for five slices running (3a, 3b1, 3c1, 3c2, 3d-T2).
#
# The empty [workspace] table declares this its own workspace root so the parent workspace does
# not try to adopt it.
[workspace]

[package]
name = "ring"
version = "0.17.14"
edition = "2021"
publish = false

# Feature names other crates in the graph request (quinn-proto asks for wasm32_unknown_unknown_js).
# A missing name here fails resolution before any type-checking happens.
[features]
default = ["alloc", "dev_urandom_fallback"]
alloc = []
dev_urandom_fallback = []
std = ["alloc"]
wasm32_unknown_unknown_js = []
less-safe-getrandom-custom-or-rdrand = []
less-safe-getrandom-espidf = []
slow_tests = []
test_logging = []
unstable-testing-arm-no-hw = []
unstable-testing-arm-no-neon = []
